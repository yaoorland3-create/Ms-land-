<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MS Land - Envoie-moi un message anonyme</title>
    <style>
        :root {
            --bg-color: #0b132b;
            --card-bg: #1c2541;
            --border-color: #3a506b;
            --accent-color: #3a86ff;
            --accent-hover: #2667ff;
            --text-main: #ffffff;
            --text-sub: #8d99ae;
        }

        body.theme-cyan {
            --bg-color: #03071e;
            --card-bg: #121e31;
            --border-color: #1f3a5f;
            --accent-color: #00b4d8;
            --accent-hover: #0096c7;
        }

        body.theme-midnight {
            --bg-color: #09090b;
            --card-bg: #18181b;
            --border-color: #27272a;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; transition: background-color 0.3s; }
        
        .card { background: var(--card-bg); padding: 35px 30px; border-radius: 20px; width: 100%; max-width: 420px; box-shadow: 0 15px 35px rgba(0,0,0,0.4); text-align: center; border: 1px solid var(--border-color); position: relative; transition: all 0.3s; }
        
        .color-picker { position: absolute; top: 20px; right: 20px; display: flex; gap: 6px; }
        .color-dot { width: 16px; height: 16px; border-radius: 50%; cursor: pointer; border: 2px solid rgba(255,255,255,0.2); transition: transform 0.2s; }
        .color-dot:hover { transform: scale(1.2); }
        .dot-blue { background: #3a86ff; }
        .dot-cyan { background: #00b4d8; }
        .dot-midnight { background: #3b82f6; }

        .logo-badge { background: var(--accent-color); color: white; display: inline-block; padding: 6px 14px; border-radius: 20px; font-size: 0.8rem; font-weight: 700; letter-spacing: 1px; margin-bottom: 15px; text-transform: uppercase; transition: background 0.3s; }
        
        h1 { font-size: 1.4rem; margin-bottom: 8px; font-weight: 700; color: var(--text-main); }
        p { font-size: 0.9rem; color: var(--text-sub); margin-bottom: 25px; line-height: 1.4; }
        
        textarea { width: 100%; height: 130px; background: var(--bg-color); border: 1px solid var(--border-color); border-radius: 12px; padding: 14px; color: var(--text-main); font-size: 0.95rem; resize: none; outline: none; transition: all 0.2s; }
        textarea:focus { border-color: var(--accent-color); box-shadow: 0 0 0 3px rgba(58, 134, 255, 0.2); }
        
        button { background: var(--accent-color); color: white; border: none; width: 100%; padding: 14px; border-radius: 12px; font-weight: 600; font-size: 1rem; cursor: pointer; margin-top: 15px; transition: background 0.2s, transform 0.1s; }
        button:hover { background: var(--accent-hover); }
        button:active { transform: scale(0.98); }
        
        .status { margin-top: 15px; font-size: 0.85rem; font-weight: 500; min-height: 20px; }
        .success { color: #4ade80; }
        .error { color: #f87171; }
    </style>
</head>
<body>

    <div class="card">
        <div class="color-picker">
            <div class="color-dot dot-blue" onclick="setTheme('default')" title="Bleu Classique"></div>
            <div class="color-dot dot-cyan" onclick="setTheme('cyan')" title="Bleu Cyan"></div>
            <div class="color-dot dot-midnight" onclick="setTheme('midnight')" title="Bleu Nuit Profond"></div>
        </div>

        <div class="logo-badge">MS Land</div>
        <h1>Dis-moi quelque chose...</h1>
        <p>Envoie-moi un message anonyme en toute tranquillité. Ton identité reste secrète.</p>
        
        <form id="messageForm">
            <textarea id="messageContent" placeholder="Écris ton message ici..." required></textarea>
            <button type="submit">Envoyer anonymement</button>
        </form>
        
        <div id="status" class="status"></div>
    </div>

    <script>
        function setTheme(themeName) {
            document.body.className = '';
            if (themeName !== 'default') {
                document.body.classList.add('theme-' + themeName);
            }
            localStorage.setItem('ms_land_theme', themeName);
        }

        const savedTheme = localStorage.getItem('ms_land_theme');
        if (savedTheme) {
            setTheme(savedTheme);
        }

        const form = document.getElementById('messageForm');
        const textarea = document.getElementById('messageContent');
        const statusDiv = document.getElementById('status');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const content = textarea.value.trim();
            if (!content) return;

            statusDiv.textContent = "Envoi en cours...";
            statusDiv.className = "status";

            try {
                const response = await fetch('/api/send', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content })
                });

                const data = await response.json();

                if (response.ok) {
                    statusDiv.textContent = "Message envoyé avec succès ! ✨";
                    statusDiv.className = "status success";
                    textarea.value = '';
                } else {
                    throw new Error(data.error || 'Erreur lors de l\'envoi');
                }
            } catch (err) {
                statusDiv.textContent = "Impossible d'envoyer le message. Réessaie.";
                statusDiv.className = "status error";
            }
        });
    </script>
</body>
</html>
